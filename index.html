<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Davy Jones Sunken Treasure</title>
</head>
<body>

<div class="cabinet" id="cabinet">

  <video class="glass-video" autoplay muted loop playsinline>
    <source src="images/vid.mp4" type="video/mp4">
  </video>

  <div class="marquee">
    <img src="images/logo.png" alt="Davy Jones Sunken Treasures" class="logo">
  </div>

  <div class="jackpot-banner">
    <div class="jackpot-tile grand">
      <span class="jp-label">Grand</span>
      <span class="jp-amount">$25,000.000k</span>
    </div>
    <div class="jackpot-tile major">
      <span class="jp-label">Major</span>
      <span class="jp-amount">$2,000.000k</span>
    </div>
    <div class="jackpot-tile minor">
      <span class="jp-label">Minor</span>
      <span class="jp-amount">$1,000.000k</span>
    </div>
    <div class="jackpot-tile mini">
      <span class="jp-label">Mini</span>
      <span class="jp-amount">$200.000k</span>
    </div>
  </div>

  <div class="character-container">
    <img src="images/davy.png" alt="Davy Jones" class="character"> 
  </div>

  <div class="glass">
    <div id="reelsGrid" class="reels-grid">
      <!-- 5 reel columns are built by JS (buildReelDOM) so the
           strip length / cell count stay in sync with the
           engine config in one place instead of being hand
           duplicated in markup. -->
    </div>

    <!-- Shown briefly when 6+ clams land: clams pop open and
         reveal pearls before the bonus game takes over. -->
    <div id="clamOverlay" class="clam-overlay hidden"></div>

    <!-- Bonus game UI (spins remaining, shovel notices, chest
         reveal) renders inside this panel, on top of the same
         5x4 grid used by the base game. -->
    <div id="bonusOverlay" class="bonus-overlay hidden">
      <div class="bonus-header">
        <span class="bonus-title">Treasure Chest Bonus</span>
        <span class="bonus-spins">Spins left: <b id="bonusSpinsLeft">6</b></span>
      </div>
      <div id="bonusNotice" class="bonus-notice hidden"></div>
      <div id="chestReveal" class="chest-reveal hidden">
        <div class="chest-reveal-title">Treasure Reveal</div>
        <div id="chestList" class="chest-list"></div>
        <div class="chest-total">Bonus win: <b id="chestTotal">0</b></div>
      </div>
    </div>
  </div>


  <div class="readouts">
    <div class="readout">
      <div class="label">Credits</div>
      <div class="value" id="balance">100</div>
    </div>
    <div class="readout">
      <div class="label">Bet</div>
      <div class="value" id="betDisplay">5</div>
    </div>
  </div>

  <div class="message" id="message">Pull the lever or press spin</div>

  <div class="controls">
    <div class="bet-control">
      <button id="betDown" aria-label="Decrease bet">-</button>
      <span id="betMini">5</span>
      <button id="betUp" aria-label="Increase bet">+</button>
    </div>
    <button class="spin-btn" id="spinBtn">Spin</button>
  </div>

  <div class="lever-wrap" id="leverWrap">
    <div class="lever-track"></div>
    <div class="lever-stick" id="leverStick">
      <div class="lever-knob"></div>
    </div>
    <div class="lever-base"></div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
